name: build

on:
  push:
    branches:
      - 'bug-jdk24-screenshottest'
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '24'

      - name: Validate screenshot
        run: ./gradlew :app:validateDebugScreenshotTest --rerun-tasks --stacktrace
