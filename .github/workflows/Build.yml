name: build

on:
  workflow_dispatch:

jobs:
  assemble:
    strategy:
       matrix:
         os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          ref: 'gradle-29395'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Assemble
        run: ./gradlew -M pgp,sha256 --export-keys build -s

